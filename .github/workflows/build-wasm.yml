name: Build WASM

on:
  push:
    branches: [main]
    paths:
      - 'src/main_wasi.zig'
      - 'build.zig'
      - 'build.zig.zon'
      - 'vendor/**'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        run: |
          curl -L https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Verify Zig
        run: zig version

      - name: Build nullclaw.wasm (wasm32-wasi)
        run: |
          zig build -Doptimize=ReleaseSmall \
            -Dtarget=wasm32-wasi \
            -Dchannels=none \
            -Dengines=none \
            -Dembedded_wasm3=false \
            -Dstatic=false 2>&1 || true
          # Check if wasm exists
          if [ -f zig-out/bin/nullclaw.wasm ]; then
            ls -lh zig-out/bin/nullclaw.wasm
          else
            echo "Build failed, checking for errors..."
            zig build -Doptimize=ReleaseSmall -Dtarget=wasm32-wasi -Dchannels=none -Dengines=none -Dembedded_wasm3=false -Dstatic=false 2>&1
            echo "=== Trying with relaxed ==="
            zig build -Doptimize=ReleaseSafe -Dtarget=wasm32-wasi -Dchannels=none -Dengines=none -Dembedded_wasm3=false -Dstatic=false 2>&1
            exit 1
          fi

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: nullclaw-wasm
          path: zig-out/bin/nullclaw.wasm
          retention-days: 90
          if-no-files-found: error
